<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0D11" />
    <title>Mustafa Kamel · Senior Product Designer</title>
    <meta
      name="description"
      content="Mustafa Kamel · Senior Product Designer specializing in UX strategy, design systems, and AI-driven products across SaaS, e-commerce, and fintech."
    />
    <meta property="og:title" content="Mustafa Kamel · Senior Product Designer" />
    <meta
      property="og:description"
      content="Designing products people remember. 6+ years across SaaS, e-commerce, fintech, and AI-driven products."
    />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("mk-theme") === "light") {
            document.documentElement.classList.add("light");
          }
          var lang = localStorage.getItem("mk-lang") === "ar" ? "ar" : "en";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
